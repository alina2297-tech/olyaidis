<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/diamond.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DJ Olyaidis — восточная хаус музыка, мероприятия и аренда оборудования."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>DJ OLYAIDIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css">
    <base href="/./">
  </head>
  <body>
    <main class="hero">
      <div class="hero__frame">
        <div class="hero__visual">
          <img
            class="hero__photo"
            src="/images/hero.jpg"
            alt="DJ Olyaidis за диджейским пультом"
          />
          <img class="hero__fade" src="/images/hero-fade.png" alt="" />
        </div>

        <div class="hero__panel">
          <div class="hero__copy">
            <div class="hero__heading">
              <img class="hero__ornament" src="/images/decor-line.svg" alt="" />
              <h1>DJ OLYAIDIS</h1>
            </div>

            <ul class="services">
              <li class="services__sep services__sep--lead" aria-hidden="true">
                <img src="/images/diamond.svg" alt="" />
              </li>
              <li>ВОСТОЧНАЯ ХАУС МУЗЫКА</li>
              <li class="services__sep" aria-hidden="true">
                <img src="/images/diamond.svg" alt="" />
              </li>
              <li>DJ НА МЕРОПРИЯТИЯХ</li>
              <li class="services__sep" aria-hidden="true">
                <img src="/images/diamond.svg" alt="" />
              </li>
              <li>АРЕНДА ОБОРУДОВАНИЯ</li>
            </ul>

            <p class="hero__note">
              Сайт находится в разработке...<br />
              Скоро здесь появится актуальная информация
            </p>
          </div>

          <ul class="crumbs">
            <li class="crumbs__item crumbs__item--light">DJ SETS</li>
            <li class="crumbs__sep" aria-hidden="true">/</li>
            <li class="crumbs__item">EVENTS</li>
            <li class="crumbs__sep" aria-hidden="true">/</li>
            <li class="crumbs__item">SOUND &amp; LIGHT</li>
          </ul>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
